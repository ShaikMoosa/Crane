[package]
name = "crane"
version = "0.1.0"
description = "A calm, local-first Markdown notebook"
authors = ["Crane contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crane-application = { path = "../crates/application" }
crane-domain = { path = "../crates/domain" }
crane-platform = { path = "../crates/platform" }
crane-storage = { path = "../crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

