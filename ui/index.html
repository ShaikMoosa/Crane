<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#242523">
    <title>Ember Notes</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true">
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M6.75 3.75h8.5l3 3v13.5H6.75z"/><path d="M15.25 3.75v3h3M9.5 11h6M9.5 14.5h6"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 4 6 0-.5 5 2.5 2.5v1H7v-1L9.5 9zM12 12.5V20"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4.5 6.5h15v13h-15zM3.5 4h17v3h-17zM9.5 11h5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5.5 7.5h13M9 7.5V5h6v2.5M7.5 7.5l.8 12h7.4l.8-12M10 11v5M14 11v5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.5-5 9-5 9 5 9 5-3.5 5-9 5-9-5-9-5z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19h4l10-10-4-4L5 15zM13.5 6.5l4 4"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol>
    </svg>

    <main class="app-shell" data-mobile-pane="list">
      <aside class="library" aria-label="Library">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <strong>Ember</strong>
        </div>

        <nav class="collection-nav" aria-label="Note collections">
          <button class="nav-item is-active" data-collection="notes" aria-label="Notes" title="Notes"><svg><use href="#i-note"></use></svg><span>Notes</span><kbd id="notes-count">0</kbd></button>
          <button class="nav-item" data-collection="pinned" aria-label="Pinned notes" title="Pinned notes"><svg><use href="#i-pin"></use></svg><span>Pinned</span></button>
          <button class="nav-item" data-collection="archive" aria-label="Archived notes" title="Archived notes"><svg><use href="#i-archive"></use></svg><span>Archive</span></button>
          <button class="nav-item" data-collection="trash" aria-label="Trash" title="Trash"><svg><use href="#i-trash"></use></svg><span>Trash</span></button>
        </nav>

        <div class="section-label"><span>Tags</span><button class="plain-icon" id="clear-tag" title="Show all tags" aria-label="Show all tags"><svg><use href="#i-chevron"></use></svg></button></div>
        <nav class="tag-nav" id="tag-nav" aria-label="Tags"></nav>

        <div class="library-footer">
          <button class="theme-button" id="theme-toggle"><svg><use href="#i-sun"></use></svg><span>Change appearance</span></button>
          <p>Private by default<br><span>Saved on this device</span></p>
        </div>
      </aside>

      <section class="note-browser" aria-label="Notes">
        <header class="browser-header">
          <div class="browser-heading">
            <button class="mobile-library" id="open-library" aria-label="Open library"><svg><use href="#i-chevron"></use></svg></button>
            <div>
            <h1 id="collection-title">Notes</h1>
            </div>
          </div>
          <button class="new-note" id="new-note" title="New note (Ctrl+N)" aria-label="Create a new note"><svg><use href="#i-plus"></use></svg></button>
        </header>
        <label class="search-box">
          <svg><use href="#i-search"></use></svg>
          <input id="search-input" type="search" placeholder="Search your notes" autocomplete="off" spellcheck="false">
          <kbd>Ctrl F</kbd>
        </label>
        <div class="active-filter" id="active-filter" hidden></div>
        <div class="note-list" id="note-list" aria-label="Note results"></div>
        <div class="empty-list" id="empty-list" hidden>
          <span class="empty-spark" aria-hidden="true"></span>
          <h2>Nothing here yet</h2>
          <p>Your next thought has plenty of room.</p>
        </div>
      </section>

      <article class="editor-pane" aria-label="Editor">
        <header class="editor-toolbar">
          <button class="mobile-back" id="editor-back"><svg><use href="#i-chevron"></use></svg><span>Notes</span></button>
          <div class="save-feedback">
            <p class="save-status" aria-live="polite"><span id="save-label">Saved locally</span></p>
            <div class="save-error" id="save-error" role="alert" hidden><span>Save failed.</span><button id="retry-save">Retry</button></div>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button" id="preview-toggle" title="Toggle preview" aria-label="Toggle Markdown preview"><svg><use href="#i-eye"></use></svg></button>
            <button class="icon-button" id="pin-note" title="Pin note" aria-label="Pin current note"><svg><use href="#i-pin"></use></svg></button>
            <div class="menu-wrap">
              <button class="icon-button" id="more-menu-button" title="More note actions" aria-label="More note actions" aria-expanded="false"><svg><use href="#i-more"></use></svg></button>
              <div class="action-menu" id="action-menu" hidden>
                <button id="archive-note"><svg><use href="#i-archive"></use></svg><span>Move to archive</span></button>
                <button id="trash-note" class="danger"><svg><use href="#i-trash"></use></svg><span>Move to trash</span></button>
                <button id="restore-note"><svg><use href="#i-note"></use></svg><span>Restore note</span></button>
              </div>
            </div>
          </div>
        </header>

        <div class="editor-empty" id="editor-empty" hidden>
          <div class="paper-glyph"><span></span></div>
          <h2>Select a note</h2>
          <p>Choose something from the list, or start a fresh page.</p>
          <button id="empty-new-note">Write a new note</button>
        </div>

        <div class="editor-document" id="editor-document">
          <input class="title-input" id="title-input" value="" placeholder="Untitled note" aria-label="Note title" maxlength="500">
          <div class="note-meta"><span id="note-date"></span><span aria-hidden="true">·</span><span id="word-count">0 words</span></div>
          <textarea class="body-input" id="body-input" placeholder="Begin with a thought…" aria-label="Note body" spellcheck="true"></textarea>
          <div class="markdown-preview" id="markdown-preview" hidden></div>
          <footer class="editor-footer"><div id="note-tags" class="note-tags"></div><span>Markdown</span></footer>
        </div>
      </article>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
