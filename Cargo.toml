[workspace]
members = [
    "crates/application",
    "crates/domain",
    "crates/platform",
    "crates/storage",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"
pulldown-cmark = "=0.13.4"
windows-sys = "=0.61.2"
